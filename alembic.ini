# alembic.ini — Tier 4 slice 4 (docs/roadmap/tier4-replatform-design.md,
# "Alembic (slice 4)"). Scoped to schema-migration tooling only: no ORM
# models, `db.py`'s raw psycopg query functions are untouched. This file is
# only used by the `alembic` CLI for a developer authoring a NEW revision
# (`alembic revision -m "..."`) or inspecting history (`alembic current`,
# `alembic history`) — the app itself never shells out to this CLI at boot;
# `db.py:_run_alembic_upgrade()` drives `alembic.command` as a library call
# against the SAME `Config` object this file's `[alembic]` section seeds,
# with `sqlalchemy.url` overridden at runtime from `DATABASE_URL` (never
# hardcode a real DB URL in a committed file).
[alembic]
script_location = alembic

# env.py imports `core.schema_model` (target_metadata): the bare `alembic` CLI
# needs the repo root on sys.path. The app's own library call already has it.
prepend_sys_path = .

# Placeholder — always overridden at runtime by db.py from DATABASE_URL.
# Present only so a developer running the bare `alembic` CLI by hand for
# `alembic history`/`alembic revision` gets a working default against the
# local dev DB (matches this repo's own .env.example convention).
sqlalchemy.url = postgresql+psycopg://postgres:postgres@localhost:5432/sana_turnos

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
